services:
  # Base de Datos PostgreSQL aislada para el Microservicio de Auth
  auth-db:
    image: postgres:16-alpine
    container_name: fmat-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fmat_auth
    ports:
      # Se expone en el puerto 5433 en el host para evitar colisiones si otro microservicio ya usa el 5432
      - "${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fmat_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

  # Microservicio Auth Backend (NestJS)
  auth-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fmat-auth-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@auth-db:5432/fmat_auth}
      # Obligatorio y sin valor por defecto: debe ser el mismo que usa el API Gateway.
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      # Broker de eventos. Sin él el servicio funciona, pero /health responde "degraded".
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://host.docker.internal:5672}
      # Con NODE_ENV=production solo se aceptan estos orígenes por CORS.
      # Por defecto, el shell de Auth y los microfrontends locales.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178}
    ports:
      - "${PORT:-4000}:3000"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - auth-network
      - restaurant-network

volumes:
  auth_postgres_data:
    driver: local

networks:
  auth-network:
    driver: bridge
  restaurant-network:
    name: restaurant-network
    external: true
